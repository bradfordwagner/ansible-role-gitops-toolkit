name: container-tags
on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}
jobs:
  container:
    uses: bradfordwagner/gh-template-lib/.github/workflows/ansible_role.yml@0.2.0
    permissions:
      contents: read
    with:
      version: ${{ github.ref_name }}
  ansible-role-publish:
    name: publish
    needs: container
    runs-on: ubuntu-latest
    steps:
      - name: checkout=self
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: galaxy_publish
        uses: robertdebock/galaxy-action@7d89099e09f4385ec4b53eb58c0d120f1ad806dd # 1.2.1
        with:
          galaxy_api_key: ${{ secrets.GALAXY_TOKEN }}
          git_branch: ${{ github.ref_name }}
