name: container-branches
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}
jobs:
  container:
    uses: bradfordwagner/gh-template-lib/.github/workflows/ansible_role.yml@15b233fb2fc6108fa811c065baadf74dfc899788 # 0.3.0
    permissions:
      contents: read
    with:
      version: latest
